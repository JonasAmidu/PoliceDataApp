name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: police_telemetry_test
          POSTGRES_USER: telemetry_test
          POSTGRES_PASSWORD: telemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry_test -d police_telemetry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TELEMETRY_TEST_DATABASE_URL: postgresql://telemetry_test:telemetry_test@localhost:5432/police_telemetry_test?sslmode=disable
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run admin authentication and data-access checks
        run: python -m unittest discover -s private_admin -p 'test_*.py' -v
      - name: Verify server startup and health checks
        run: python tests/deployment_smoke.py
      - name: Run JavaScript regression tests
        run: node --test tests/test_home_map.js tests/test_subpages.js tests/test_telemetry.js

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: police_telemetry_test
          POSTGRES_USER: telemetry_test
          POSTGRES_PASSWORD: telemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry_test -d police_telemetry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TELEMETRY_TEST_DATABASE_URL: postgresql://telemetry_test:telemetry_test@localhost:5432/police_telemetry_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run combined browser integration checks
        run: python tests/browser_smoke.py
      - name: Verify admin login, mobile layout and PostgreSQL data access
        run: python private_admin/browser_smoke.py
