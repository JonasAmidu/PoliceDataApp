<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jonas Amidu">
    <title>{% block title %}Police Data UK Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="fas fa-shield-alt me-1"></i> Police Data UK
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{{ url_for('index') }}"><i class="fas fa-home"></i> Dashboard</a>
                    <a class="nav-link" href="{{ url_for('forces') }}"><i class="fas fa-building"></i> Forces</a>
                    <a class="nav-link" href="{{ url_for('crimes') }}"><i class="fas fa-exclamation-triangle"></i> Crimes</a>
                    <a class="nav-link" href="{{ url_for('neighbourhoods') }}"><i class="fas fa-users"></i> Neighbourhoods</a>
                    <a class="nav-link" href="{{ url_for('stop_search') }}"><i class="fas fa-search"></i> Stop & Search</a>
                    <a class="nav-link" href="{{ url_for('analytics') }}"><i class="fas fa-chart-line"></i> Analytics</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-4" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light mt-5 py-4">
        <div class="container text-center">
            <p class="mb-2">Police Data UK Portal | Data Source: <a href="https://data.police.uk" class="text-light" target="_blank" rel="noopener noreferrer">Police UK API</a></p>
            <div class="d-flex flex-wrap justify-content-center align-items-center gap-3">
                <span>Created by <a href="https://github.com/JonasAmidu" class="text-light" target="_blank" rel="author noopener noreferrer">Jonas Amidu</a></span>
                <a href="https://github.com/JonasAmidu/PoliceDataApp" class="text-light" target="_blank" rel="noopener noreferrer"><i class="fab fa-github me-1" aria-hidden="true"></i>Contribute on GitHub</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
